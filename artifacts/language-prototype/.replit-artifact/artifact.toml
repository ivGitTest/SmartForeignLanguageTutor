kind = "web"
previewPath = "/language-prototype/"
title = "English Lab — прототип"
description = "Личный прототип для записи английской речи и проверки её улучшения B1 → B2/C1 с настраиваемыми инструкциями и параметрами OpenRouter. Проверяется в Firefox на ПК."
version = "1.0.0"
id = "artifacts/language-prototype"
router = "path"

[[services]]
name = "web"
paths = [ "/language-prototype/" ]
localPort = 19507

[services.development]
run = "pnpm --filter @workspace/language-prototype run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/language-prototype", "run", "build" ]
serve = "static"
publicDir = "artifacts/language-prototype/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19507"
BASE_PATH = "/language-prototype/"
