kind = "mobile"
previewPath = "/"
title = "Мобильное приложение"
description = "Стартовый проект мобильного приложения для iOS и Android. Предназначен для добавления требований и документации перед определением функций и пользовательских сценариев."
version = "1.0.0"
id = "artifacts/mobile-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24382

[services.development]
run = "pnpm --filter @workspace/mobile-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "serve" ]

[services.env]
PORT = "24382"
BASE_PATH = "/"
