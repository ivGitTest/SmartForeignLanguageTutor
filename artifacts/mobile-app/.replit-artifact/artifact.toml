kind = "mobile"
previewPath = "/"
title = "Smart Lang Tutor"
description = "Android MVP: локальный словарь, обучение SM-2, аудиоматериалы и прямое подключение пользовательского OpenRouter-ключа. Без собственного сервера и регистрации."
version = "1.0.0"
id = "artifacts/mobile-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24382

[services.development]
run = "pnpm --filter @workspace/mobile-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-app", "run", "serve" ]

[services.env]
PORT = "24382"
BASE_PATH = "/"
